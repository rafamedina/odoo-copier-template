name: ${PROJECT_NAME:-odoo-dev}

services:
  db:
    image: postgres:${POSTGRES_VERSION:-16}
    environment:
      POSTGRES_USER: odoo #pragma: allowlist secret
      POSTGRES_PASSWORD: odoo #pragma: allowlist secret
      POSTGRES_DB: postgres
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  odoo:
    image: odoo:${ODOO_VERSION:-18}
    depends_on:
      - db
    ports:
      - "${ODOO_PORT:-8069}:8069"
    environment:
      HOST: db 
      USER: odoo #pragma: allowlist secret
      PASSWORD: odoo #pragma: allowlist secret
    volumes:
      # Every folder in the repo root with a __manifest__.py is an addon
      - .:/mnt/extra-addons:z
      - odoo-data:/var/lib/odoo
    command:
      odoo -d ${ODOO_DB:-odoo} -i ${ODOO_MODULES:-base} -u ${ODOO_MODULES:-base}
      --load-language=${ODOO_LANG:-es_ES} --dev=reload,qweb,xml

volumes:
  db-data:
  odoo-data:
